name: Aggiorna feed RSS Questura Mantova

# Il workflow gira sia con uno schedule interno di GitHub Actions (ogni ora,
# come backup) sia tramite workflow_dispatch, innescabile via API da un
# cronjob esterno (es. cron-job.org) che chiama:
#   POST /repos/mbmichele/feed_questura_mn/actions/workflows/update-feed.yml/dispatches
#
# Nota: lo schedule di GitHub Actions è in UTC ed è "best effort" (può
# slittare di qualche minuto in caso di carico sui runner condivisi); il
# cronjob esterno resta il modo più puntuale per garantire l'orario.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      debug_dump:
        description: >-
          Salva come artifact scaricabile l'HTML/XML grezzo scaricato da
          ogni fonte (utile per capire perché il parser non trova nulla)
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed
        env:
          # Lo schedule non ha "inputs", quindi il debug dump è attivabile
          # solo lanciando il workflow a mano con "Run workflow"
          DEBUG_DUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_dump && '1' || '0' }}
        run: python scripts/generate_feed.py

      - name: Upload debug dump
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_dump }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-dump
          path: debug/
          retention-days: 7

      - name: Commit and push if the feed changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- docs/feed.xml; then
            echo "Nessuna modifica al feed, niente da committare."
            exit 0
          fi

          git add docs/feed.xml
          git commit -m "Aggiorna feed.xml [skip ci]"

          # Il cron interno e quello esterno possono innescare due run quasi
          # in contemporanea: se nel frattempo un'altra run ha già fatto
          # push, si riallinea con un rebase e si riprova (fino a 5 volte)
          # invece di fallire con "fetch first".
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push riuscito al tentativo $attempt."
              exit 0
            fi
            echo "Push fallito (tentativo $attempt), riallineo con rebase e riprovo..."
            sleep $((RANDOM % 10 + 5))
            git fetch origin main
            git rebase origin/main
          done

          echo "::error::Push fallito dopo diversi tentativi."
          exit 1
